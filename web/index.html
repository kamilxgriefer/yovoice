<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <!--
    Firebase Auth's hosted action-handler page (firebaseapp.com/__/auth/action)
    has an "app link" continuation step for verifyEmail that hops through
    this project's default Hosting domain before falling through to the real
    continueUrl — confirmed by testing real emailed links, not assumed. This
    site's own catch-all SPA rewrite (every path -> index.html) swallows that
    intermediary hop before it can complete, landing the user on the bare
    Flutter app instead of https://yovoice.app/verify-email. There's no
    Identity Platform config that disables this hop (Dynamic Links, the only
    alternative to HOSTING_DOMAIN, were shut down by Google in 2025), so this
    page detects the hop by its referrer and finishes the redirect itself,
    before the Flutter engine even starts loading.
  -->
  <script>
    (function () {
      var ref = document.referrer || "";
      if (ref.indexOf("firebaseapp.com/__/auth/action") !== -1) {
        window.location.replace("https://yovoice.app/verify-email");
      }
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="color-scheme" content="dark">

  <!--
    The website's /app launch screen fades its composition out and navigates
    here. With no background declared, the browser paints its default white
    canvas for everything between navigation and the Flutter engine's first
    frame — a white flash at the exact end of an otherwise seamless
    transition. #0D0618 is AppColors.background (lib/core/theme/app_colors.dart),
    so the hand-off lands on the colour Flutter is about to paint anyway.
  -->
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background-color: #0D0618;
    }

    #yovoice-bootstrap {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: radial-gradient(circle at 50% 40%, #1b0c31 0, #0d0618 64%);
      color: white;
      font-family: Inter, Arial, sans-serif;
      transition: opacity 180ms ease-out;
    }

    #yovoice-bootstrap.boot-leaving { opacity: 0; }

    .boot-content {
      display: flex;
      width: min(520px, calc(100vw - 48px));
      /* The mark — not the taller mark+copy composition — stays at the
         viewport centre, matching native and Flutter startup surfaces. */
      transform: translateY(41px);
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .boot-mark {
      position: relative;
      display: grid;
      width: clamp(250px, 29vw, 300px);
      aspect-ratio: 1;
      place-items: center;
    }

    .boot-mark::before,
    .boot-mark::after {
      content: "";
      position: absolute;
      inset: 18%;
      border: 2px solid rgba(192, 38, 255, .34);
      border-radius: 50%;
      animation: boot-ring 1.8s ease-out infinite;
    }

    .boot-mark::after { animation-delay: -.9s; }

    .boot-mark img {
      position: relative;
      z-index: 1;
      width: 170px;
      height: 170px;
      object-fit: contain;
      filter: drop-shadow(0 0 22px rgba(192, 38, 255, .22));
    }

    .boot-title {
      z-index: 3;
      margin: -74px -.34em 0 0;
      font-size: clamp(27px, 4vw, 32px);
      font-weight: 800;
      letter-spacing: .34em;
      text-shadow: 0 0 14px rgba(13, 6, 24, .85), 0 0 4px rgba(43, 10, 68, .6);
    }

    .boot-copy {
      margin: 12px 0 0;
      color: #b4adc8;
      font-size: 17px;
      font-weight: 600;
    }

    .boot-wave {
      display: flex;
      height: 54px;
      margin-top: 38px;
      align-items: center;
      gap: clamp(5px, 1.3vw, 10px);
    }

    .boot-wave span {
      width: 5px;
      height: 18%;
      border-radius: 999px;
      background: linear-gradient(to top, #6d28d9, #e64dff);
      animation: boot-wave 1.15s ease-in-out infinite alternate;
      transform-origin: center;
    }

    .boot-wave span:nth-child(2n) { animation-delay: -.72s; }
    .boot-wave span:nth-child(3n) { animation-delay: -.36s; }
    .boot-wave span:nth-child(4n) { animation-delay: -.94s; }
    .boot-wave span:nth-child(5n) { animation-delay: -.18s; }

    @keyframes boot-ring {
      /* The scale wraps only while invisible. Keeping alpha at zero at both
         ends avoids the bright ring popping back into existence each loop. */
      0% { opacity: 0; transform: scale(.72); }
      18% { opacity: .52; }
      72% { opacity: .18; }
      100% { opacity: 0; transform: scale(1.48); }
    }

    @keyframes boot-wave {
      0% { transform: scaleY(.45); }
      100% { transform: scaleY(3); }
    }

    @media (prefers-reduced-motion: reduce) {
      .boot-mark::before, .boot-mark::after, .boot-wave span { animation: none; }
      .boot-wave span:nth-child(3n + 1) { transform: scaleY(1.8); }
      .boot-wave span:nth-child(3n + 2) { transform: scaleY(2.6); }
    }

    @media (max-width: 419px) {
      .boot-content { transform: translateY(40px); }
      .boot-title { margin-top: -66px; }
      .boot-wave { margin-top: 28px; }
    }
  </style>

  <title>YoVoice</title>

  <meta name="description" content="Connect, speak, be you.">
  <meta name="theme-color" content="#994BE7">
  <meta name="application-name" content="YoVoice">

  <meta property="og:title" content="YoVoice">
  <meta property="og:description" content="Connect, speak, be you.">
  <meta property="og:type" content="website">

  <!-- Mobile -->
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Apple -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="YoVoice">

  <!--
    Favicon — one source of truth with the marketing site. Every file
    below is a straight downscale of yovoice-website's src/app/icon.png
    (the canonical symbol, public/logos/yo-voice-symbol.png, centred on a
    512x512 transparent canvas), so this tab and the landing-page tab
    show the same mark at the same scale and padding.

    The previous set came from RealFaviconGenerator and had a solid black
    square baked into every size — visible as a dark tile around the mark
    in the tab strip. See web/README.md before regenerating.

    ?v=2 busts the browser/CDN copy of that black-square version; bump it
    whenever the artwork changes.
  -->
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=2">
  <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png?v=2">
  <link rel="shortcut icon" href="favicon.ico?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
  <link rel="manifest" href="site.webmanifest?v=2">

</head>

<body>

  <div id="yovoice-bootstrap" role="status" aria-label="Opening YO Voice">
    <div class="boot-content">
      <div class="boot-mark" aria-hidden="true">
        <img src="web-app-manifest-512x512.png?v=2" alt="">
      </div>
      <div class="boot-title">YO VOICE</div>
      <p class="boot-copy">Create your space</p>
      <div class="boot-wave" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->

  <script src="flutter_bootstrap.js" async></script>

</body>
</html>

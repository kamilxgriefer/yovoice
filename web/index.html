<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <!--
    Firebase Auth's hosted action-handler page (firebaseapp.com/__/auth/action)
    has an "app link" continuation step for verifyEmail that hops through
    this project's default Hosting domain before falling through to the real
    continueUrl — confirmed by testing real emailed links, not assumed. This
    site's own catch-all SPA rewrite (every path -> index.html) swallows that
    intermediary hop before it can complete, landing the user on the bare
    Flutter app instead of https://yovoice.app/verify-email. There's no
    Identity Platform config that disables this hop (Dynamic Links, the only
    alternative to HOSTING_DOMAIN, were shut down by Google in 2025), so this
    page detects the hop by its referrer and finishes the redirect itself,
    before the Flutter engine even starts loading.
  -->
  <script>
    (function () {
      var ref = document.referrer || "";
      if (ref.indexOf("firebaseapp.com/__/auth/action") !== -1) {
        window.location.replace("https://yovoice.app/verify-email");
      }
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <title>YoVoice</title>

  <meta name="description" content="Connect, speak, be you.">
  <meta name="theme-color" content="#994BE7">

  <meta property="og:title" content="YoVoice">
  <meta property="og:description" content="Connect, speak, be you.">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="YoVoice">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">

</head>

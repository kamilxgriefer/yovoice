name: yovoice
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+2

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  cloud_functions: ^6.0.1

  google_sign_in: ^7.1.1

  flutter_svg: ^2.2.0
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  image_picker: ^1.2.0
  livekit_client: ^2.7.0
  permission_handler: ^12.0.1
  share_plus: ^12.0.2
  audioplayers: ^6.8.1
  record: ^7.1.1
  path_provider: ^2.1.5
  # Direct, because the web half of Voice Moment recording reads the
  # MediaRecorder blob itself. Already resolved transitively via record_web
  # at the version pubspec.lock pins, so this adds no new resolution.
  web: ^1.1.1
  firebase_app_check: ^0.4.6
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.2.0
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.1
  image: ^4.9.1
  firebase_crashlytics: ^5.2.7
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.7.0
  riverpod_generator: ^3.0.3
  flutter_launcher_icons: ^0.14.4
  firebase_auth_mocks: ^0.15.2
  fake_cloud_firestore: ^4.2.0
  mock_exceptions: ^0.8.2
  firebase_core_platform_interface: ^8.1.0
  firebase_storage_mocks: ^0.8.1

dependency_overrides:
  device_info_plus: 12.3.0
  connectivity_plus: 7.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
        - asset: assets/fonts/InterVariable-Italic.ttf
          style: italic

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app-store-icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#0B1026"
  adaptive_icon_foreground: assets/images/yo-voice-favicon-512.png
  adaptive_icon_foreground_inset: 8

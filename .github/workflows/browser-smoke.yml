name: Flutter web browser smoke

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yovoice-browser-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    name: Playwright against release web build
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter browser media regressions
        run: >-
          flutter test --platform chrome
          test/web_audio_capture_browser_test.dart
          test/image_crop_test.dart
          test/room_cover_editor_test.dart

      - name: Build the release web artifact
        run: >-
          flutter build web --release
          --dart-define=YOVOICE_WEB_PUSH_VAPID_KEY=BGa6os6npm6shnDdNP4rbqFS8wC5brGTY0RVzt59mZvpOhX3EeaCUpOaZRw2TmQeXK5gpZ1whEKvJEhmSD0mikU
          --dart-define=YOVOICE_APPLE_SIGN_IN_ENABLED=true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: browser-tests/package-lock.json

      - name: Install browser-test dependencies
        run: npm --prefix browser-tests ci

      - name: Install Chromium and system dependencies
        run: npm --prefix browser-tests exec -- playwright install chromium --with-deps

      - name: Run Playwright browser smoke tests
        run: npm --prefix browser-tests test

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yovoice-playwright-${{ github.sha }}
          path: |
            browser-tests/playwright-report/
            browser-tests/test-results/
          if-no-files-found: ignore
          retention-days: 14

name: Deploy YO Voice to Firebase Hosting

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      # Firestore security rules suite against the real emulator. Rules
      # DEPLOYS stay manual on purpose (see docs/DEPLOYMENT.md) — this
      # only proves the rules in the repo still pass their tests before
      # anything ships.
      - name: Set up Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Firestore + Storage rules tests
        run: |
          npm --prefix firestore-tests ci
          npx firebase-tools emulators:exec --only firestore --project demo-yovoice \
            'npm --prefix firestore-tests test'
          npx firebase-tools emulators:exec --only storage --project demo-yovoice \
            'npm --prefix firestore-tests run test:storage'

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_YOVOICE_EC54A }}'
          projectId: yovoice-ec54a
          channelId: live

name: Deploy YO Voice to Firebase Hosting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_hosting:
        description: Deploy the verified web artifact to production Hosting
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify_and_build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: yovoice-verify-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify generated product-sound assets
        run: python3 tool/generate_ui_sounds.py --check

      - name: Analyze project
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      # Firestore security rules suite against the real emulator. Rules
      # DEPLOYS stay manual on purpose (see docs/DEPLOYMENT.md) — this
      # only proves the rules in the repo still pass their tests before
      # anything ships.
      - name: Set up Java (Firestore emulator)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js (Firebase Functions)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            firestore-tests/package-lock.json
            functions/package-lock.json

      - name: Install Firebase test dependencies
        run: |
          npm --prefix firestore-tests ci
          npm --prefix functions ci

      - name: Audit production Node dependencies
        run: |
          npm --prefix firestore-tests audit --omit=dev --audit-level=high
          npm --prefix functions audit --omit=dev --audit-level=high

      - name: Run Firestore rules tests
        run: |
          ./firestore-tests/node_modules/.bin/firebase emulators:exec --only firestore --project demo-yovoice \
            'npm --prefix firestore-tests test'

      - name: Run Storage rules tests
        run: |
          ./firestore-tests/node_modules/.bin/firebase emulators:exec --only firestore,storage --project demo-yovoice \
            'npm --prefix firestore-tests run test:storage'

      # Family media authorization spans both products. Running this suite with
      # one project id is essential because Storage rules read Firestore state.
      - name: Run cross-service Family media rules tests
        run: |
          ./firestore-tests/node_modules/.bin/firebase emulators:exec --only firestore,storage --project demo-yovoice \
            'npm --prefix firestore-tests run test:family-media'

      - name: Run Firebase Functions tests
        run: |
          ./firestore-tests/node_modules/.bin/firebase emulators:exec --only auth,firestore --project demo-yovoice \
            'npm --prefix functions test'

      - name: Smoke-test deployed Function bindings
        run: |
          ./firestore-tests/node_modules/.bin/firebase emulators:exec --only functions,auth,firestore --project demo-yovoice \
            'npm --prefix functions run test:smoke'

      - name: Build Flutter Web
        run: >-
          flutter build web --release
          --dart-define=YOVOICE_WEB_PUSH_VAPID_KEY=BGa6os6npm6shnDdNP4rbqFS8wC5brGTY0RVzt59mZvpOhX3EeaCUpOaZRw2TmQeXK5gpZ1whEKvJEhmSD0mikU
          --dart-define=YOVOICE_APPLE_SIGN_IN_ENABLED=true

      - name: Package verified Hosting artifact
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_hosting
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yovoice-web-${{ github.sha }}
          path: build/web
          if-no-files-found: error
          retention-days: 1

  deploy_hosting:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_hosting
    needs: verify_and_build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    concurrency:
      group: yovoice-production-hosting
      cancel-in-progress: false

    steps:
      - name: Checkout verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download verified Hosting artifact
        uses: actions/download-artifact@974686ed5098c7f9c9289ec946b9058e496a2561 # v8.0.0
        with:
          name: yovoice-web-${{ github.sha }}
          path: build/web

      - name: Deploy verified artifact to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_YOVOICE_EC54A }}'
          projectId: yovoice-ec54a
          channelId: live
          firebaseToolsVersion: 15.27.0

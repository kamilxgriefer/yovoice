Own the assigned mobile-store or monetization work for YO Voice.

Read CLAUDE.md, current premium and entitlement code, backend verification paths, and deployment documentation. Cover App Store and Google Play product mapping, purchase, pending, cancel, failure, restore, renewal, expiry, grace period, refund, revocation, family or complimentary access where supported, receipt or transaction verification, account transfer, and store-review requirements. Server-authoritative entitlements are mandatory; UI badges and client state never grant access.


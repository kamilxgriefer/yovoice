<!-- YO Voice — email verification body.
     Paste into: Firebase Console → Authentication → Templates →
     Email address verification → Message (HTML). Same constraints as
     password-reset.html: requires the custom SMTP sender (Resend);
     %LINK% is Firebase's placeholder. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0d0618" style="background-color:#0d0618;margin:0;padding:0;">
  <tr>
    <td align="center" style="padding:40px 16px;">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;width:100%;">
        <tr>
          <td align="center" style="padding-bottom:28px;">
            <img src="https://yovoice.app/logos/yovoice-logo.png" alt="YO Voice" width="56" height="56" style="display:block;border-radius:14px;" />
          </td>
        </tr>
        <tr>
          <td bgcolor="#191329" style="background-color:#191329;border:1px solid #3a3151;border-radius:20px;padding:36px 32px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="center" style="font-family:Arial,Helvetica,sans-serif;color:#ffffff;font-size:24px;font-weight:bold;padding-bottom:14px;">
                  One last step
                </td>
              </tr>
              <tr>
                <td align="center" style="font-family:Arial,Helvetica,sans-serif;color:#b4adc8;font-size:14px;line-height:1.6;padding-bottom:28px;">
                  Verify your email address to finish setting up your
                  YO&nbsp;Voice account.
                </td>
              </tr>
              <tr>
                <td align="center" style="padding-bottom:24px;">
                  <a href="%LINK%" target="_blank" style="display:inline-block;background-color:#7b2ff7;color:#ffffff;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:bold;text-decoration:none;padding:15px 44px;border-radius:999px;">
                    Verify email
                  </a>
                </td>
              </tr>
              <tr>
                <td align="center" style="font-family:Arial,Helvetica,sans-serif;color:#7e7895;font-size:12px;line-height:1.6;">
                  If you didn't create a YO Voice account, you can ignore
                  this email.
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td align="center" style="font-family:Arial,Helvetica,sans-serif;color:#7e7895;font-size:12px;line-height:1.8;padding-top:28px;">
            YO Voice &middot; be you
          </td>
        </tr>
        <tr>
          <td align="center" style="font-family:Arial,Helvetica,sans-serif;color:#55506a;font-size:11px;line-height:1.6;padding-top:16px;">
            Button not working? Copy this link into your browser:<br />
            <a href="%LINK%" style="color:#8d5bff;text-decoration:underline;word-break:break-all;">%LINK%</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
